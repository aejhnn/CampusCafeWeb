<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café - Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f3f5; padding: 32px; color: #111827; }

        .kiosk-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 32px;
            max-width: 1350px;
            margin: 0 auto;
        }

        /* MENU HEADER & NAV */
        .page-title {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -1.5px;
        }

        .menu-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .categories {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .cat-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
            padding: 4px 0;
        }

        .cat-btn.active {
            font-weight: 800;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 8px 16px 8px 34px;
            border-radius: 20px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            outline: none;
            width: 200px;
            background: white;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 13px;
        }

        /* PRODUCT GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
        }

        .image-placeholder {
            height: 140px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        /* Pastel background variations matching drink types */
        .bg-coffee { background-color: #f3ede8; }
        .bg-matcha { background-color: #e2ebd8; }
        .bg-strawberry { background-color: #fbe6e8; }
        .bg-taro { background-color: #e9e3f4; }
        .bg-refresca { background-color: #fdf0d5; }
        .bg-chocolate { background-color: #ebdcd5; }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }

        /* RIGHT RECEIPT PANEL */
        .order-panel {
            background: #e5e7eb;
            border-radius: 20px;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 64px);
            position: sticky;
            top: 32px;
            overflow: hidden;
        }

        .order-header {
            background: #253874;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border-radius: 16px 16px 0 0;
        }

        .order-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: #cbd5e1;
            font-weight: bold;
            cursor: pointer;
        }

        .order-footer {
            padding: 20px;
            border-top: 1px solid #d1d5db;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 18px;
            color: #111827;
        }

        .summary-row.total {
            font-size: 22px;
            font-weight: 800;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .btn-pay {
            width: 100%;
            background: #101c42;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .btn-pay:hover {
            background: #1e293b;
        }

        /* MODAL POPUP */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: #9ca3af;
            cursor: pointer;
        }

        .modal-image {
            height: 120px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-price {
            font-size: 22px;
            font-weight: 800;
            color: #101c42;
            margin-bottom: 20px;
        }

        .btn-add-modal {
            width: 100%;
            background: #101c42;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="kiosk-container">
        <!-- LEFT: MENU SECTION -->
        <div>
            <h1 class="page-title">Menu</h1>

            <div class="menu-nav">
                <div class="categories">
                    <button class="cat-btn active" onclick="filterCategory('All', event)">All</button>
                    <button class="cat-btn" onclick="filterCategory('Coffee', event)">Coffee</button>
                    <button class="cat-btn" onclick="filterCategory('Non-Coffee', event)">Non-Coffee</button>
                    <button class="cat-btn" onclick="filterCategory('Tea', event)">Tea & Milk Tea</button>
                    <button class="cat-btn" onclick="filterCategory('Chocolate', event)">Chocolate</button>
                </div>

                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search" onkeyup="searchMenu()">
                </div>
            </div>

            <div id="products-grid" class="products-grid"></div>
        </div>

        <!-- RIGHT: ORDER RECEIPT PANEL -->
        <div class="order-panel">
            <div class="order-header">Order #</div>

            <div id="cart-body" class="order-body">
                <div style="text-align: center; color: #6b7280; margin-top: 40px; font-size: 14px;">Select items from the menu to build your order</div>
            </div>

            <div class="order-footer">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-val">₱0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (12%)</span>
                    <span id="tax-val">₱0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total-val">₱0.00</span>
                </div>

                <button class="btn-pay" onclick="payNow()">PAY NOW</button>
            </div>
        </div>
    </div>

    <!-- PRODUCT DETAILS MODAL -->
    <div id="product-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modal-img" class="modal-image"></div>
            <h3 id="modal-title" class="modal-title"></h3>
            <p id="modal-desc" class="modal-desc"></p>
            <div id="modal-price" class="modal-price"></div>
            <button id="modal-add-btn" class="btn-add-modal">Add to Order</button>
        </div>
    </div>

    <script src="customer.js"></script>
</body>
</html>
