<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Café Interactive Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">CAMPUS CAFÉ <span>| Interactive Management Board</span></div>
        <button class="btn-primary" onclick="fetchAllData()">Show All</button>
    </header>

    <main class="container">
        <!-- NAVIGATION TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products-tab', event)">📋 Menu Products</button>
            <button class="tab-btn" onclick="switchTab('ingredients-tab', event)">📦 Ingredients Inventory & Stock Control</button>
            <button class="tab-btn" onclick="switchTab('employees-tab', event)">👥 Employees</button>
            <button class="tab-btn" onclick="switchTab('suppliers-tab', event)">🚚 Supplier & Delivery</button>
        </div>

        <!-- TAB 1: MENU PRODUCTS -->
        <section id="products-tab" class="tab-content active">
            <div class="grid-layout">
                <div class="card form-card">
                    <h3>+ Add Product</h3>
                    <form id="product-form">
                        <label>Product Name</label>
                        <input type="text" id="p-name" required>

                        <label>Category</label>
                        <select id="p-category">
                            <option value="Coffee">Coffee</option>
                            <option value="Non-Coffee">Non-Coffee</option>
                            <option value="Tea & Milk Tea">Tea & Milk Tea</option>
                            <option value="Chocolate">Chocolate</option>
                        </select>

                        <label>Price (PHP)</label>
                        <input type="number" step="0.01" id="p-price" required>

                        <label>Description</label>
                        <textarea id="p-desc" rows="3"></textarea>

                        <div class="checkbox-group">
                            <input type="checkbox" id="p-available" checked>
                            <label for="p-available">Available for Order</label>
                        </div>

                        <button type="submit" class="btn-dark">Save to Database</button>
                    </form>
                </div>

                <div class="products-grid">
                    <div class="category-block">
                        <h4>☕ COFFEE</h4>
                        <div id="coffee-list"></div>
                    </div>
                    <div class="category-block">
                        <h4>🥤 NON-COFFEE</h4>
                        <div id="non-coffee-list"></div>
                    </div>
                    <div class="category-block blue-header">
                        <h4>🧋 TEA & MILK TEA</h4>
                        <div id="milktea-list"></div>
                    </div>
                    <div class="category-block brown-header">
                        <h4>🍫 CHOCOLATE</h4>
                        <div id="chocolate-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 2: INGREDIENTS -->
        <section id="ingredients-tab" class="tab-content">
            <div class="grid-layout">
                <div class="card form-card">
                    <h3>+ Add Ingredient</h3>
                    <form id="ingredient-form">
                        <label>Ingredient Name</label>
                        <input type="text" id="i-name" required>

                        <label>Stock Quantity</label>
                        <input type="number" id="i-qty" required>

                        <label>Unit (e.g. kg, ml, bags)</label>
                        <input type="text" id="i-unit" required>

                        <button type="submit" class="btn-dark">Save Ingredient</button>
                    </form>
                </div>

                <div class="card inventory-card">
                    <div class="search-bar">
                        <input type="text" id="search-ingredient" placeholder="Type ingredient name to search..." onkeyup="filterIngredients()">
                        <button class="btn-primary">Search</button>
                    </div>
                    <div id="ingredients-list" class="list-container"></div>
                </div>
            </div>
        </section>

        <!-- TAB 3: EMPLOYEES -->
        <section id="employees-tab" class="tab-content">
            <div class="grid-layout">
                <div class="card form-card">
                    <h3>+ Add Employee</h3>
                    <form id="employee-form">
                        <label>Employee Name</label>
                        <input type="text" id="e-name" required>

                        <label>Contact Number</label>
                        <input type="text" id="e-phone" required>

                        <label>Work Schedule</label>
                        <input type="text" id="e-schedule" placeholder="e.g. Full-Time / Part-Time">

                        <button type="submit" class="btn-dark">Save Employee</button>
                    </form>
                </div>

                <div class="card inventory-card">
                    <div class="search-bar">
                        <input type="text" id="search-employee" placeholder="Type employee name to search..." onkeyup="filterEmployees()">
                        <button class="btn-primary">Search</button>
                    </div>
                    <div id="employees-list" class="list-container"></div>
                </div>
            </div>
        </section>

        <!-- TAB 4: SUPPLIERS -->
        <section id="suppliers-tab" class="tab-content">
            <div class="grid-layout">
                <div class="card form-card">
                    <h3>+ Add Supplier</h3>
                    <form id="supplier-form">
                        <label>Supplier Name</label>
                        <input type="text" id="s-name" required>

                        <label>Contact Person</label>
                        <input type="text" id="s-person" required>

                        <label>Phone</label>
                        <input type="text" id="s-phone" required>

                        <button type="submit" class="btn-dark">Save Supplier</button>
                    </form>
                </div>

                <div class="card inventory-card">
                    <div class="search-bar">
                        <input type="text" id="search-supplier" placeholder="Type supplier name to search..." onkeyup="filterSuppliers()">
                        <button class="btn-primary">Search</button>
                    </div>
                    <div id="suppliers-list" class="list-container"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
